[package]
name = "aibb-desktop-pet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aibb_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
keyring = "4.2.0"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
scraper = "0.24.0"
ipnet = "2.11.0"
encoding_rs = "0.8.35"
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
opener = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
